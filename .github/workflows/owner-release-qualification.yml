name: Owner release qualification
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, perf/release-qualification-sop, perf/release-qualification-umbrella, codex/skills-umbrella]
permissions:
  contents: read
jobs:
  release-qualification:
    name: owner-release-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: medking82/hermes-fleet-sync
          ref: 4f79a5b4452d9a91037e4cbf564a927b44e2bac6
          path: .qualification-runner
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install pyyaml==6.0.3
      - name: Qualify the exact source commit
        run: python -B scripts/qualify-release.py --runner .qualification-runner --state "$RUNNER_TEMP/release-qualification"
